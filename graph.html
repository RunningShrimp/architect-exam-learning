<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识图谱 · 架构师学堂</title>
<meta name="description" content="62个知识点的依赖与关联网络">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="topbar" class="topbar"></header>
<main class="wrap" style="max-width:1200px">
  <div class="kp-head">
    <h1>🕸️ 知识图谱</h1>
    <p class="foreshadow"><b>实线箭头</b> = 依赖（学它之前先学箭头起点）；<b>虚线</b> = 关联（互相解释、容易一起考）。节点颜色 = 你的进度：<span style="color:var(--ok)">绿</span>=测试过，<span style="color:var(--accent)">蓝</span>=学过，<span style="color:var(--text-dim)">灰</span>=未学。点节点直达页面。</p>
    <p>
      <button class="btn" id="btn-deps" style="border-color:var(--accent)">显示依赖边 ✔</button>
      <button class="btn" id="btn-rel" style="border-color:var(--accent-2)">显示关联边 ✔</button>
      <select id="jump" style="background:var(--card-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px"><option value="">—— 快速跳转知识点 ——</option></select>
    </p>
  </div>
  <section class="sec">
    <div class="demo-stage" id="graph-stage"><p class="foreshadow">图谱加载中……（file:// 直开不可用，请用本地服务器）</p></div>
  </section>
</main>
<footer class="site-footer">架构师学堂 · 边越多说明这页学得越值得——它连着一串概念</footer>
<script>
window.KP_BOOT = function (CX) {
  var U = CX.utils;
  CX.ready(function (idx) {
    if (!idx) return;
    var s = CX.getState();
    var pts = idx.points;
    var byId = {};
    pts.forEach(function (p) { byId[p.id] = p; });

    /* 布局：11 域为列，域内按序号纵向排 */
    var domKeys = Object.keys(idx.domains);
    var colW = 118, rowH = 74, W = domKeys.length * colW + 60;
    var maxRows = 0;
    var pos = {};
    domKeys.forEach(function (dk, ci) {
      var list = pts.filter(function (p) { return p.domain === dk; });
      maxRows = Math.max(maxRows, list.length);
      list.forEach(function (p, ri) {
        pos[p.id] = { x: 40 + ci * colW + colW / 2, y: 70 + ri * rowH, ci: ci };
      });
    });
    var H = 70 + maxRows * rowH + 30;
    var nodeW = 96, nodeH = 40;

    function nodeColor(p) {
      var pg = s.pages[p.id];
      if (pg && pg.best != null && pg.best > 0) return 'var(--ok)';
      if (pg && pg.visited) return 'var(--accent)';
      return 'var(--text-dim)';
    }
    function short(t) { return t.length > 7 ? t.slice(0, 7) + '…' : t; }

    var svg = ['<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" id="gsvg">'];
    svg.push('<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>' +
      '<marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"/></marker></defs>');
    svg.push('<rect width="' + W + '" height="' + H + '" fill="var(--bg-soft)" rx="12"/>');
    /* 域标题 */
    domKeys.forEach(function (dk, ci) {
      var d = idx.domains[dk];
      svg.push('<text x="' + (40 + ci * colW + colW / 2) + '" y="34" text-anchor="middle" font-size="15">' + d.icon + '</text>');
      svg.push('<text x="' + (40 + ci * colW + colW / 2) + '" y="52" text-anchor="middle" font-size="11" fill="var(--text-dim)">' + CX.esc(d.name) + '</text>');
    });
    /* 边 */
    var showDeps = true, showRel = true;
    function edges() {
      var drawn = {}; /* 规范化键去重：依赖边优先，任何一类画过即跳过 */
      var key = function (a, b) { return [a, b].sort().join('-'); };
      var out = '';
      pts.forEach(function (p) {
        p.deps.forEach(function (depId) {
          if (!showDeps || !pos[depId]) return;
          if (drawn[key(depId, p.id)]) return;
          drawn[key(depId, p.id)] = 1;
          var a = pos[depId], b = pos[p.id];
          var x1 = a.x + nodeW / 2 - 6, y1 = a.y + nodeH / 2 - 6, x2 = b.x, y2 = b.y;
          var mx = (x1 + x2) / 2;
          out += '<path d="M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2 + '" fill="none" stroke="var(--accent)" stroke-width="1.6" opacity=".55" marker-end="url(#arr)" class="e-deps"/>';
        });
      });
      pts.forEach(function (p) {
        p.rel.forEach(function (r) {
          if (!showRel || !pos[r]) return;
          if (p.deps.indexOf(r) >= 0) return;
          if (drawn[key(p.id, r)]) return;
          drawn[key(p.id, r)] = 1;
          var a = pos[p.id], b = pos[r];
          out += '<path d="M' + a.x + ',' + a.y + ' L' + b.x + ',' + b.y + '" stroke="var(--accent-2)" stroke-width="1.2" stroke-dasharray="4 5" opacity=".4" fill="none" class="e-rel"/>';
        });
      });
      return out;
    }
    var edgeLayer = '<g id="edge-layer">' + edges() + '</g>';
    /* 节点 */
    var nodes = pts.map(function (p) {
      var q = pos[p.id];
      var x = q.x - nodeW / 2, y = q.y - nodeH / 2;
      var href = 'kp/' + p.file.split('/').pop();
      return '<g style="cursor:pointer" data-id="' + p.id + '" class="gnode">' +
        '<title>' + CX.esc(p.id + ' · ' + p.title + ' —— ' + p.oneliner) + '</title>' +
        '<rect x="' + x + '" y="' + y + '" width="' + nodeW + '" height="' + nodeH + '" rx="9" fill="var(--card)" stroke="' + nodeColor(p) + '" stroke-width="2"/>' +
        '<text x="' + (q.x) + '" y="' + (q.y - 4) + '" text-anchor="middle" font-size="11" font-weight="700" fill="' + nodeColor(p) + '">' + p.id + '</text>' +
        '<text x="' + (q.x) + '" y="' + (q.y + 12) + '" text-anchor="middle" font-size="10.5" fill="var(--text)">' + CX.esc(short(p.title)) + '</text>' +
        '</g>';
    }).join('');
    svg.push(edgeLayer);
    svg.push(nodes);
    svg.push('</svg>');
    var stage = U.$('graph-stage');
    stage.innerHTML = svg.join('');

    /* 交互 */
    stage.addEventListener('click', function (e) {
      var g = e.target.closest && e.target.closest('.gnode');
      if (g) location.href = 'kp/' + byId[g.getAttribute('data-id')].file.split('/').pop();
    });
    function redraw() {
      var layer = stage.querySelector('#edge-layer');
      if (layer) layer.innerHTML = edges();
    }
    U.$('btn-deps').addEventListener('click', function () {
      showDeps = !showDeps;
      this.textContent = (showDeps ? '显示依赖边 ✔' : '显示依赖边 ✗');
      this.style.opacity = showDeps ? 1 : .5;
      redraw();
    });
    U.$('btn-rel').addEventListener('click', function () {
      showRel = !showRel;
      this.textContent = (showRel ? '显示关联边 ✔' : '显示关联边 ✗');
      this.style.opacity = showRel ? 1 : .5;
      redraw();
    });
    var jump = U.$('jump');
    pts.forEach(function (p) {
      var o = document.createElement('option');
      o.value = 'kp/' + p.file.split('/').pop();
      o.textContent = p.id + ' · ' + p.title;
      jump.appendChild(o);
    });
    jump.addEventListener('change', function () { if (jump.value) location.href = jump.value; });
  });
};
</script>
<script defer src="assets/app.js"></script>
</body>
</html>
